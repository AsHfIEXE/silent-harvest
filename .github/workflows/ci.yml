name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.12', '3.13']
        include:
          # 3.9 is gone from ubuntu-latest (26.04) images; keep that leg on
          # the older runner where it still exists
          - os: ubuntu-22.04
            python: '3.9'
          - os: windows-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install deps
        run: pip install cryptography

      - name: Container selftest + PSK rejection
        run: python server/shcrypto.py

      - name: Malformed-input tests
        run: python test/test_fuzz.py

      - name: Firefox key4/logins roundtrip
        run: python test/synth_firefox.py

      - name: Chromium v10 roundtrip
        run: python test/synth_chromium.py

      - name: Linux implant end-to-end over synthetic home
        run: python test/synth_linux.py

      - name: Linux implant selftest (crypto backends)
        run: python linux/sh_harvest.py --selftest

      - name: TUI headless frame
        run: python server/tui.py --demo

      - name: C2 loop integration (collector + tasking + exec-as-loot)
        run: python test/test_c2_loop.py

      - name: Cross-language interop (build C# -> run -> python decrypt)
        if: runner.os == 'Windows'
        run: python test/interop_cs.py

      - name: Tool scripts parse clean on every platform
        run: |
          pip install impacket
          python -c "import ast,glob;[ast.parse(open(f,encoding='utf-8').read()) for f in glob.glob('server/*.py')+glob.glob('tools/*.py')];print('all server/tools scripts parse clean')"
